services:
  marbrerie-front:
    build:
      context: .
      dockerfile: dev/Dockerfile
    container_name: marbrerie-front
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=500
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"    
        reservations:
          memory: 512m
    networks:
      - internal-net

networks:
  internal-net:
    external: true